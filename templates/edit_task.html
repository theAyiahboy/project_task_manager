{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Task</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <div class="mx-auto max-w-2xl px-6 py-12">

        <div class="mb-8">
            <a href="{% url 'home' %}" class="text-sm font-medium text-blue-600 hover:text-blue-800">
                ← Back to Dashboard
            </a>

            <h1 class="mt-4 text-3xl font-bold">
                Edit Task
            </h1>

            <p class="mt-2 text-slate-600">
                Update task details for
                <span class="font-semibold">{{ task.project.name }}</span>.
            </p>
        </div>

        <div class="rounded-xl bg-white p-8 shadow-sm">

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-medium text-slate-700">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                    <div class="mt-2 text-sm text-red-600">
                        {{ field.errors }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="flex items-center gap-4 pt-4">

                    <button type="submit"
                        class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700">
                        Save Changes
                    </button>

                    <a href="{% url 'home' %}"
                        class="rounded-lg bg-slate-200 px-6 py-3 font-semibold text-slate-700 hover:bg-slate-300">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>

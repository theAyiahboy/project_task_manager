{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Task</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <div class="mx-auto max-w-lg px-6 py-16">

        <div class="rounded-xl bg-white p-8 shadow-sm">

            <div class="mb-6">
                <h1 class="text-2xl font-bold text-red-600">
                    Delete Task
                </h1>

                <p class="mt-3 text-slate-600">
                    Are you sure you want to delete this task?
                </p>
            </div>

            <div class="mb-6 rounded-lg bg-slate-50 p-4">
                <h2 class="font-semibold text-slate-900">
                    {{ task.title }}
                </h2>

                <p class="mt-1 text-sm text-slate-600">
                    Project: {{ task.project.name }}
                </p>
            </div>

            <p class="mb-6 text-sm text-red-600">
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="flex items-center gap-4">

                    <button type="submit"
                        class="rounded-lg bg-red-600 px-6 py-3 font-semibold text-white hover:bg-red-700">
                        Yes, Delete Task
                    </button>

                    <a href="{% url 'home' %}"
                        class="rounded-lg bg-slate-200 px-6 py-3 font-semibold text-slate-700 hover:bg-slate-300">
                        Cancel
                    </a>

                </div>
            </form>

        </div>

    </div>

</body>

</html>

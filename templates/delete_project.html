
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Project | Task Manager</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <main class="mx-auto max-w-xl px-6 py-20">

        <div class="rounded-2xl bg-white p-8 text-center shadow-sm">

            <div class="mb-4 text-5xl">
                ⚠️
            </div>

            <h1 class="text-3xl font-bold text-slate-800">
                Delete Project?
            </h1>

            <p class="mt-4 text-slate-600">
                Are you sure you want to delete
                <span class="font-semibold text-red-600">
                    {{ project.name }}
                </span>?
            </p>

            <p class="mt-3 text-sm text-red-500">
                This action cannot be undone. All tasks belonging to this
                project will also be deleted.
            </p>

            <form method="POST" class="mt-8 flex justify-center gap-4">

                {% csrf_token %}

                <button type="submit"
                    class="rounded-lg bg-red-600 px-6 py-3 font-semibold text-white transition hover:bg-red-700">
                    Yes, Delete Project
                </button>

                <a href="{% url 'home' %}"
                    class="rounded-lg bg-slate-200 px-6 py-3 font-semibold text-slate-700 transition hover:bg-slate-300">
                    Cancel
                </a>

            </form>

        </div>

    </main>

</body>
</html>
